[project]
name = "commitpreflight"
version = "0.1.0"
description = "Pre-flight lint for commit messages written by AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["git", "commit", "lint", "conventional-commits", "ai-agents", "pre-commit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/swarmbrr/commitpreflight"
Source = "https://github.com/swarmbrr/commitpreflight"
Issues = "https://github.com/swarmbrr/commitpreflight/issues"

[project.scripts]
commitpreflight = "commitpreflight.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commitpreflight"]
